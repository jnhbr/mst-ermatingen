<body>
<div id="gate"><div class="loading">lade …</div></div>
<div id="app"><div class="loading">lade Daten …</div></div>
<dialog id="extraDlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/mst.js?v=202610041600" data-base="../"></script>
<script>
/* ===================== SAISON =====================
   Jede Saison ist ein Dokument padel/<id> mit ihrer Konfiguration
   (Zeitraum, Preise, die Fixen, Ausfälle der Halle). config/padel.currentSeason
   bestimmt die aktuelle Saison; ältere bleiben als Archiv lesbar. */
let SEASON = null, CURRENT_SEASON = null, CFG = null;
let seasonsList = [];   // [{ id, label }]
let FIXED = [], FIXED_IDS = [], SESSIONS = [], VENUE_CANCELLED = {};
let HOURLY_RATE, SESSION_HOURS, SESSION_COST, CLUB_PCT, GROUP_SESSION_COST, PER_PLAYER_COST, CANCELLED_SHARE;
const SESSIONS_OPEN_AHEAD = 2;
const fixName = id => (FIXED.find(f => f.id === id) || {}).short || MST.nameOf(id);

function buildSessions(start, end){
  // Rein in UTC gerechnet, sonst rutscht in der Schweiz (UTC+1/+2) jeder
  // Donnerstag auf den Mittwoch davor.
  const dates = [];
  const d = new Date(start + "T00:00:00Z"), last = new Date(end + "T00:00:00Z");
  while(d <= last){ dates.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+7); }
  return dates;
}
function applySeason(id, cfg){
  SEASON = id; CFG = cfg;
  FIXED = cfg.fixed || [];
  FIXED_IDS = FIXED.map(f => f.id);
  SESSIONS = buildSessions(cfg.start, cfg.end);
  VENUE_CANCELLED = cfg.venueCancelled || {};
  HOURLY_RATE = cfg.hourlyRate;
  SESSION_HOURS = cfg.hours;
  SESSION_COST = HOURLY_RATE * SESSION_HOURS;
  CLUB_PCT = cfg.clubPct;
  GROUP_SESSION_COST = SESSION_COST * (1 - CLUB_PCT);
  PER_PLAYER_COST = GROUP_SESSION_COST / 4;
  CANCELLED_SHARE = FIXED.length ? GROUP_SESSION_COST / FIXED.length : 0; // Absage: alle Fixen tragen den Termin
}
const seasonLabel = id => "Saison " + id.replace(/^20(\d\d)-(\d\d)$/, "$1/$2");
const isArchive = () => SEASON !== CURRENT_SEASON;
const canEdit = () => me.admin || !isArchive();

function todayISO(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
}

/* ===================== DATEN (Firestore) =====================
   padel/<SEASON>                 Konfiguration der Saison
   padel/<SEASON>/days/<datum>:
     <memberId>: Zeitstempel (kann) | "declined" (kann nicht)   – nur die Fixen
     extras: { x_…: { typ:"gast"|"mitglied", name, memberId?, ts, paidTo, by } }
     cancelled: true                                             – nur Admin
   padel/<SEASON>/beer/<id>:
     { date, payer, amount, drinkers:[memberId | x_…], note, by, at }
   log/<id>:  Änderungsprotokoll { at, by, byName, area, season, text } */
const FV = firebase.firestore.FieldValue;
let daysCol = null, beerCol = null;
let unsub = [];

let days = {};
let beers = [];
let loadedDays = false, loadedBeer = false;
let currentTab = "verfuegbarkeit";
let saveStatus = "idle";
let me = null; // MST.user

MST.start(async (user) => {
  me = user;
  const [conf, seasons] = await Promise.all([db.collection("config").doc("padel").get(), db.collection("padel").get()]);
  CURRENT_SEASON = conf.exists ? conf.data().currentSeason : null;
  seasonsList = [];
  seasons.forEach(d => seasonsList.push({ id:d.id, cfg:d.data() }));
  seasonsList.sort((a,b) => b.id.localeCompare(a.id));
  const wanted = new URLSearchParams(location.search).get("saison");
  openSeason(seasonsList.find(s => s.id === wanted) ? wanted : (CURRENT_SEASON || (seasonsList[0] && seasonsList[0].id)));
});

function openSeason(id){
  unsub.forEach(f => f()); unsub = [];
  const s = seasonsList.find(x => x.id === id);
  if(!s){ document.getElementById("app").innerHTML = '<div class="loading">Noch keine Saison angelegt.</div>'; return; }
  applySeason(id, s.cfg);
  days = {}; beers = []; loadedDays = loadedBeer = false; beerDraft = null;
  render();
  const seasonRef = db.collection("padel").doc(id);
  daysCol = seasonRef.collection("days");
  beerCol = seasonRef.collection("beer");
  unsub.push(daysCol.onSnapshot(snap => {
    days = {}; snap.forEach(d => { days[d.id] = d.data(); });
    loadedDays = true; render();
  }, err => { console.error(err); saveStatus="error"; updateSaveIndicatorOnly(); }));
  unsub.push(beerCol.onSnapshot(snap => {
    beers = []; snap.forEach(d => beers.push({ id:d.id, ...d.data() }));
    beers.sort((a,b) => (b.date.localeCompare(a.date)) || (b.at - a.at));
    loadedBeer = true; render();
  }, err => { console.error(err); saveStatus="error"; updateSaveIndicatorOnly(); }));
}

/* Speichern + Eintrag ins Änderungsprotokoll (sieht nur der Admin). */
async function write(promise, text){
  saveStatus = "saving"; updateSaveIndicatorOnly();
  try{
    await promise; saveStatus = "saved";
    if(text) MST.log("padel", `${seasonLabel(SEASON)} · ${text}`, { season:SEASON });
  }
  catch(e){ console.error(e); saveStatus = "error"; alert("Konnte nicht gespeichert werden (keine Berechtigung oder keine Verbindung)."); }
  updateSaveIndicatorOnly();
}
function updateSaveIndicatorOnly(){
  const el = document.getElementById("saveIndicator");
  if(!el) return;
  el.className = "save-indicator " + saveStatus;
  el.querySelector(".save-txt").textContent = {idle:"live", saving:"speichert …", saved:"gespeichert", error:"Fehler"}[saveStatus];
}

/* ===================== AUSWERTUNG =====================
   Alles wird bei jedem Rendern frisch aus days + beers berechnet.
   Vorrang: Die 7 Fixen zuerst (wenigste Spiele, dann wer sich zuerst
   angemeldet hat), danach Gäste/Mitglieder in der Reihenfolge der Anmeldung.
   Geld (alles aus Sicht der 7 Fixen):
   - Feld: gespielter Termin = CHF 74.25 / 4 pro Spieler; Absage = alle 7 teilen.
   - Gast/Mitglied spielt: zahlt seinen Anteil bar einem Fixen ("bezahlt an").
     Dieser Fixe hat das Geld in der Tasche -> wird ihm belastet.
   - Bierrunde: Wer bezahlt, bekommt den Betrag gutgeschrieben; alle, die
     mitgetrunken haben, tragen einen gleichen Anteil. Der Anteil eines Gasts
     geht an den Fixen, dem der Gast bezahlt hat. */
function extrasOf(d){
  const ex = (days[d] && days[d].extras) || {};
  return Object.entries(ex).map(([key, x]) => ({ key, ...x })).sort((a,b) => (a.ts||0) - (b.ts||0));
}
function extraLabel(x){ return x.typ === "gast" ? `${x.name} (Gast)` : x.name; }
function participantName(d, id){
  if(id.startsWith("x_")){
    const x = extrasOf(d).find(e => e.key === id);
    return x ? extraLabel(x) : "(entfernt)";
  }
  return fixName(id);
}

function deriveAll(){
  const games = {}, court = {}, collected = {}, beerPaid = {}, beerShare = {};
  FIXED_IDS.forEach(p => { games[p]=0; court[p]=0; collected[p]=0; beerPaid[p]=0; beerShare[p]=0; });
  const perSession = {};
  const extraLedger = [];  // Gäste/Mitglieder: was sie schulden und wem bezahlt
  const openItems = [];    // noch nicht zugeordnet
  let unresolvedCount = 0;

  for(const d of SESSIONS){
    const ausfallReason = VENUE_CANCELLED[d] || null;
    if(ausfallReason){
      perSession[d] = { ausfall:true, ausfallReason, cancelled:false, fixAvail:[], extras:[], confirmed:[], quorum:false, day:{} };
      continue;
    }
    const day = days[d] || {};
    const cancelled = !!day.cancelled;
    const fixAvail = FIXED_IDS.filter(p => typeof day[p] === "number");
    const extras = extrasOf(d);
    const quorum = !cancelled && (fixAvail.length + extras.length) >= 4;
    let confirmed = [];
    if(quorum){
      const fixSorted = [...fixAvail].sort((a,b) => (games[a]-games[b]) || ((day[a]||0)-(day[b]||0)));
      confirmed = [...fixSorted, ...extras.map(x => x.key)].slice(0,4);
    }
    perSession[d] = { ausfall:false, cancelled, fixAvail, extras, confirmed, quorum, day };
    if(!cancelled && !quorum) unresolvedCount++;
    if(cancelled){
      FIXED_IDS.forEach(p => { court[p] += CANCELLED_SHARE; });
      continue;
    }
    for(const p of confirmed){
      if(!p.startsWith("x_")){ games[p]++; court[p] += PER_PLAYER_COST; continue; }
      const x = extras.find(e => e.key === p);
      const row = { date:d, key:p, label:extraLabel(x), memberId:x.memberId||null, paidTo:x.paidTo||null, court:PER_PLAYER_COST, beer:0 };
      extraLedger.push(row);
      if(row.paidTo) collected[row.paidTo] += PER_PLAYER_COST;
      else openItems.push(`${dateD1(d)}: ${row.label} hat gespielt – noch offen, wem bezahlt`);
    }
  }

  for(const b of beers){
    const amount = Number(b.amount) || 0;
    if(FIXED_IDS.includes(b.payer)) beerPaid[b.payer] += amount;
    const drinkers = (b.drinkers || []).filter(Boolean);
    if(!drinkers.length) continue;
    const share = amount / drinkers.length;
    for(const id of drinkers){
      if(FIXED_IDS.includes(id)){ beerShare[id] += share; continue; }
      const x = extrasOf(b.date).find(e => e.key === id);
      if(x){
        let row = extraLedger.find(r => r.key === id);
        if(!row){ row = { date:b.date, key:id, label:extraLabel(x), memberId:x.memberId||null, paidTo:x.paidTo||null, court:0, beer:0 }; extraLedger.push(row); }
        row.beer += share;
        if(x.paidTo){ collected[x.paidTo] += share; continue; }
        openItems.push(`${dateD1(b.date)}: Bieranteil von ${extraLabel(x)} – noch offen, wem bezahlt`);
      } else {
        openItems.push(`${dateD1(b.date)}: Bierrunde enthält einen entfernten Gast (${chf(share)})`);
      }
    }
  }
  extraLedger.sort((a,b) => a.date.localeCompare(b.date));
  return { perSession, games, court, collected, beerPaid, beerShare, extraLedger, openItems, unresolvedCount };
}

/* ===================== ANMELDEFENSTER =====================
   "Kann" nur für die nächsten 2 Termine, Absage jederzeit. Admin darf alles. */
function withinRegistrationWindow(d){
  const today = todayISO();
  const idx = SESSIONS.findIndex(s => s >= today);
  if(idx === -1) return true;
  const dIdx = SESSIONS.indexOf(d);
  if(dIdx === -1 || dIdx < idx) return true;
  return dIdx <= idx + (SESSIONS_OPEN_AHEAD - 1);
}
const canEditFix = id => me.admin || (!isArchive() && me.id === id);

/* ===================== FORMAT ===================== */
function chf(n){ return "CHF " + n.toLocaleString("de-CH",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function dateD1(d){ const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("de-CH",{weekday:"short", day:"2-digit", month:"2-digit"}); }
function monthLabel(d){ const dt=new Date(d+"T00:00:00"); const s=dt.toLocaleDateString("de-CH",{month:"long", year:"numeric"}); return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtDate(d){ const [y,m,dd] = d.split("-"); return `${dd}.${m}.${y}`; }
function seasonPicker(){
  if(seasonsList.length < 2) return "";
  return `<select class="season-select" id="seasonSelect" aria-label="Saison wählen">${seasonsList.map(x =>
    `<option value="${x.id}" ${x.id===SEASON?"selected":""}>${seasonLabel(x.id)}${x.id===CURRENT_SEASON?" (aktuell)":""}</option>`).join("")}</select>`;
}
function sessionStatus(d, sess){
  if(sess.ausfall) return "ausfall";
  if(sess.cancelled) return "cancelled";
  if(d === todayISO()) return "today";
  return d < todayISO() ? "past" : "upcoming";
}

function ballSVG(kind, size){
  size = size || 20;
  const colorMap = {empty:"none", neutral:"var(--yellow)", green:"var(--green)", red:"var(--red)", declined:"none"};
  const fill = colorMap[kind] || "none";
  const showSeam = kind==="neutral" || kind==="green" || kind==="red";
  return '<svg viewBox="0 0 32 32" width="'+size+'" height="'+size+'" aria-hidden="true">' +
    '<circle cx="16" cy="16" r="14" fill="'+fill+'" stroke="rgba(245,243,236,.35)" stroke-width="1.6"/>' +
    (showSeam ? '<path d="M4 11 Q16 3 28 11" fill="none" stroke="rgba(20,19,17,.55)" stroke-width="1.7"/><path d="M4 21 Q16 29 28 21" fill="none" stroke="rgba(20,19,17,.55)" stroke-width="1.7"/>' : '') +
    (kind==="declined" ? '<line x1="8" y1="8" x2="24" y2="24" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"/>' : '') +
    '</svg>';
}
function stateOf(sess, id){
  if(sess.cancelled || sess.ausfall) return "empty";
  if(id.startsWith("x_")){
    if(!sess.quorum) return "neutral";
    return sess.confirmed.includes(id) ? "green" : "red";
  }
  const val = sess.day[id];
  if(val === "declined") return "declined";
  if(typeof val !== "number") return "empty";
  if(!sess.quorum) return "neutral";
  return sess.confirmed.includes(id) ? "green" : "red";
}
const kindCls = k => k==="green"?"st-green":k==="red"?"st-red":k==="neutral"?"st-neutral":k==="declined"?"st-declined":"";

/* ===================== GERÜST ===================== */
function totalVenueCancelledSessions(){ return SESSIONS.filter(d => VENUE_CANCELLED[d]).length; }
function totalCancelledSessions(){ return SESSIONS.filter(d => !VENUE_CANCELLED[d] && days[d] && days[d].cancelled).length; }
function totalBillableSessions(){ return SESSIONS.length - totalVenueCancelledSessions(); }
function totalSeasonCost(){ return totalBillableSessions() * SESSION_COST; }
function totalClubShare(){ return totalSeasonCost() * CLUB_PCT; }
function totalGroupShare(){ return totalSeasonCost() * (1-CLUB_PCT); }
function upfrontShare(){ return totalGroupShare() / FIXED.length; }

  const app = document.getElementById("app");
  if(!loadedDays || !loadedBeer){ app.innerHTML = '<div class="loading">lade Daten …</div>'; return; }
  const derived = deriveAll();

  MST.renderUserBar();
  updateSaveIndicatorOnly();
  attachHandlers(derived);
  window.scrollTo(0, y);
}

/* ===================== TAB: VERFÜGBARKEIT ===================== */
function infoLine(sess, d){
  if(sess.ausfall) return `<span class="ausfall-text">Ausfall – ${sess.ausfallReason}. Keine Kosten, zählt nicht mit.</span>`;
  if(sess.cancelled) return `<span>Abgesagt – Feldkosten (${chf(GROUP_SESSION_COST)}) tragen alle ${FIXED.length} Fixen (je ${chf(CANCELLED_SHARE)}).</span>`;
  const n = sess.fixAvail.length + sess.extras.length;
  if(!sess.quorum) return `<span>${n}/4 angemeldet – wartet auf weitere Anmeldungen.</span>`;
  const all = [...sess.fixAvail, ...sess.extras.map(x => x.key)];
  const rest = all.filter(p => !sess.confirmed.includes(p));
  let txt = `Spielt: <span class="hl">${sess.confirmed.map(p => esc(participantName(d,p))).join(", ")}</span>`;
  if(rest.length) txt += ` · Ersatz: ${rest.map(p => esc(participantName(d,p))).join(", ")}`;
  return `<span>${txt}</span>`;
}
function extraChips(d, sess){
  const editable = canEdit() && !sess.cancelled && !sess.ausfall;
  const chips = sess.extras.map(x => {
    const paid = x.paidTo ? `<span class="paid">→ ${esc(fixName(x.paidTo))}</span>` : `<span class="paid open">→ offen</span>`;
    return `<button class="chip extra ${kindCls(stateOf(sess, x.key))}" data-action="edit-extra" data-date="${d}" data-key="${x.key}" ${editable?"":"disabled"} title="Gast/Mitglied bearbeiten">${esc(extraLabel(x))}${paid}</button>`;
  }).join("");
  const add = editable ? `<button class="add-btn" data-action="add-extra" data-date="${d}" data-typ="gast">+ Gast</button><button class="add-btn" data-action="add-extra" data-date="${d}" data-typ="mitglied">+ Mitglied</button>` : "";
  return chips + add;
}
function cancelBtn(d, sess){
  if(sess.ausfall || !me.admin) return "";
  return `<button class="cancel-x ${sess.cancelled?"is-cancelled":""}" data-action="toggle-cancel" data-date="${d}" title="${sess.cancelled?"Reaktivieren":"Termin absagen"}">${sess.cancelled?"↺":"✕"}</button>`;
}
function buildTableRows(dates, derived){
  let rows = "", lastMonth = "";
  const cols = FIXED.length + 3;
  for(const d of dates){
    const sess = derived.perSession[d];
    const m = monthLabel(d);
    if(m !== lastMonth){ rows += `<tr class="month-row"><td colspan="${cols}">${m}</td></tr>`; lastMonth = m; }
    const within = withinRegistrationWindow(d);
    const rowCls = sess.ausfall ? "ausfall-row" : (sess.cancelled ? "cancelled-row" : "");
    rows += `<tr class="${rowCls}"><td>${dateD1(d)}${sess.ausfall?' <span class="ausfall-badge">AUSFALL</span>':""}</td>`;
    for(const f of FIXED){
      const kind = stateOf(sess, f.id);
      const locked = !canEditFix(f.id);
      const tip = locked ? `${f.short} – nur ${f.short} selbst kann das ändern` : (!within && !me.admin ? `«Kann» erst für die nächsten 2 Termine, Absage schon jetzt möglich` : f.short);
      rows += `<td><button class="ball-btn ${locked?"locked":""}" data-action="toggle-avail" data-date="${d}" data-player="${f.id}" ${(sess.cancelled||sess.ausfall||locked)?"disabled":""} title="${esc(tip)}">${ballSVG(kind)}</button></td>`;
    }
    rows += `<td class="extras-cell"><div class="chips" style="margin:0">${extraChips(d, sess)}</div></td>`;
    rows += `<td>${cancelBtn(d, sess)}</td></tr>`;
    rows += `<tr class="info-row"><td colspan="${cols}">${infoLine(sess, d)}</td></tr>`;
  }
  return rows;
}
function buildCards(dates, derived){
  let cards = "", lastMonth = "";
  for(const d of dates){
    const sess = derived.perSession[d];
    const m = monthLabel(d);
    if(m !== lastMonth){ cards += `<div class="s-month">${m}</div>`; lastMonth = m; }
    const status = sessionStatus(d, sess);
    const statusLabel = {upcoming:"Kommend", today:"Heute", past:"Vergangen", cancelled:"Abgesagt", ausfall:"Ausfall"}[status];
    const chips = FIXED.map(f => {
      const locked = !canEditFix(f.id);
      return `<button class="chip ${kindCls(stateOf(sess, f.id))} ${me.id===f.id?"mine":""}" data-action="toggle-avail" data-date="${d}" data-player="${f.id}" ${(sess.cancelled||sess.ausfall||locked)?"disabled":""}>${esc(f.short)}</button>`;
    }).join("");
    cards += `
    <div class="s-card${sess.ausfall?" ausfall-row":""}">
      <div class="s-card-head">
        <div><span class="s-date">${dateD1(d)}</span> <span class="status-pill ${status}">${statusLabel}</span></div>
        ${cancelBtn(d, sess)}
      </div>
      <div class="chips">${chips}</div>
      ${sess.ausfall ? "" : `<div class="chips">${extraChips(d, sess)}</div>`}
      <div class="s-info">${infoLine(sess, d)}</div>
    </div>`;
  }
  return cards;
}
function computeNet(derived){
  const share = upfrontShare(), net = {};
  FIXED_IDS.forEach(p => { net[p] = share - derived.court[p] - derived.collected[p] + derived.beerPaid[p] - derived.beerShare[p]; });
  return net;
}

/* «Mein Stand»: nächster Termin + eigene Zahlen, direkt nach dem Login sichtbar. */
function renderMyStatus(derived){
  if(isArchive()) return "";
  const today = todayISO();
  const next = SESSIONS.find(d => d >= today && !VENUE_CANCELLED[d]);
  const isFix = FIXED_IDS.includes(me.id);
  let nextHtml = `<div class="my-next"><span class="my-lbl">Nächster Termin</span><span class="my-val">Saison ist vorbei</span></div>`;
  if(next){
    const sess = derived.perSession[next];
    let status, cls, actions = "";
    if(sess.cancelled){ status = "abgesagt"; cls = "cancelled"; }
    else if(isFix){
      const k = stateOf(sess, me.id);
      [status, cls] = { green:["du spielst", "green"], red:["Ersatz", "red"], neutral:["angemeldet, Gruppe noch offen", "neutral"],
                        declined:["kann nicht", "muted"], empty:["noch keine Angabe", "muted"] }[k];
      const within = withinRegistrationWindow(next);
      const val = sess.day[me.id];
      actions = `<div class="my-actions">
        ${within ? `<button class="btn-small ${typeof val === "number" ? "on" : ""}" data-action="set-own" data-date="${next}" data-val="kann">Kann</button>` : ""}
        <button class="btn-small ${val === "declined" ? "on" : ""}" data-action="set-own" data-date="${next}" data-val="declined">Kann nicht</button>
        ${val !== undefined ? `<button class="btn-small" data-action="set-own" data-date="${next}" data-val="clear">Zurücksetzen</button>` : ""}
      </div>`;
    } else {
      const mine = sess.extras.find(x => x.memberId === me.id);
      if(mine){
        const k = stateOf(sess, mine.key);
        [status, cls] = { green:["du spielst", "green"], red:["Ersatz – die Fixen haben Vorrang", "red"], neutral:["eingetragen, Gruppe noch offen", "neutral"] }[k] || ["eingetragen", "neutral"];
      } else {
        const filled = sess.fixAvail.length + sess.extras.length;
        status = filled >= 4 ? "voll (du kannst dich als Ersatz eintragen)" : `${4 - filled} ${4 - filled === 1 ? "Platz" : "Plätze"} frei`;
        cls = filled >= 4 ? "muted" : "green";
        actions = `<div class="my-actions"><button class="btn-small on" data-action="add-extra" data-date="${next}" data-typ="mitglied">Ich spiele mit</button></div>`;
      }
    }
    nextHtml = `<div class="my-next">
      <span class="my-lbl">Nächster Termin</span>
      <span class="my-val">${dateD1(next)} <span class="my-status ${cls}">${status}</span></span>
      ${actions}
    </div>`;
  }
  let nums = "";
  if(isFix){
    const n = computeNet(derived)[me.id];
    const beer = derived.beerPaid[me.id] - derived.beerShare[me.id];
    nums = `
      <div class="my-num"><span class="my-lbl">Spiele</span><span class="my-big">${derived.games[me.id]}</span></div>
      <div class="my-num"><span class="my-lbl">Dein Saldo</span><span class="my-big ${n < -0.05 ? "neg" : "pos"}">${n < 0 ? "− " : "+ "}${chf(Math.abs(n))}</span></div>
      <div class="my-num"><span class="my-lbl">Bier ±</span><span class="my-big ${beer < -0.005 ? "neg" : ""}">${beer < 0 ? "− " : "+ "}${chf(Math.abs(beer))}</span></div>`;
  } else {
    const rows = derived.extraLedger.filter(r => r.memberId === me.id);
    const total = rows.reduce((t,r) => t + r.court + r.beer, 0);
    const open = rows.filter(r => !r.paidTo).reduce((t,r) => t + r.court + r.beer, 0);
    nums = `
      <div class="my-num"><span class="my-lbl">Gespielt</span><span class="my-big">${rows.filter(r => r.court > 0).length}</span></div>
      <div class="my-num"><span class="my-lbl">Dein Anteil total</span><span class="my-big">${chf(total)}</span></div>
      <div class="my-num"><span class="my-lbl">Noch nicht bezahlt</span><span class="my-big ${open > 0.005 ? "neg" : ""}">${chf(open)}</span></div>`;
  }
  return `<div class="card my-card">
    <h3>Mein Stand · ${esc(me.short)}</h3>
    <div class="my-grid">${nextHtml}${nums}</div>
  </div>`;
}

function renderAvailabilityTab(derived){
  const isFix = FIXED_IDS.includes(me.id);
  const legend = `
    <div class="legend">
      <span class="legend-item">${ballSVG("neutral",15)} angemeldet, Gruppe noch offen</span>
      <span class="legend-item">${ballSVG("green",15)} bestätigt, spielt mit</span>
      <span class="legend-item">${ballSVG("red",15)} angemeldet, diesmal Ersatz</span>
      <span class="legend-item">${ballSVG("declined",15)} kann nicht</span>
    </div>
    <p class="rule-note">${isFix || me.admin
      ? `Dein Feld: 1× klicken = kann, 2× = kann nicht, 3× = leer. «Kann» geht für die nächsten 2 Termine, eine Absage jederzeit.`
      : `Du bist nicht in der Fixgruppe: Über <b>+ Mitglied</b> kannst du dich für einen Termin eintragen, wenn ein Platz frei ist.`}
      Die ${FIXED.length} Fixen haben Vorrang, Gäste und Mitglieder füllen freie Plätze auf und zahlen ihren Anteil (${chf(PER_PLAYER_COST)}) bar einem der Fixen.</p>`;
  const today = todayISO();
  const futureDates = SESSIONS.filter(d => d >= today);
  const pastDates = SESSIONS.filter(d => d < today);
  const header = `<tr><th>Datum</th>${FIXED.map(f=>`<th class="${me.id===f.id?"me":""}">${esc(f.short)}</th>`).join("")}<th style="text-align:left">Gäste / Mitglieder</th><th></th></tr>`;
  const table = ds => `<div class="table-scroll"><table class="avail"><thead>${header}</thead><tbody>${buildTableRows(ds, derived)}</tbody></table></div>`;
  let pastBlock = "";
  if(pastDates.length){
    pastBlock = `
    <details class="past-details only-desktop"><summary>Vergangene Termine anzeigen (${pastDates.length})</summary>${table(pastDates)}</details>
    <details class="past-details only-mobile"><summary>Vergangene Termine anzeigen (${pastDates.length})</summary>${buildCards(pastDates, derived)}</details>`;
  }
  return renderMyStatus(derived) + `
  <div class="card">
    ${legend}
    ${futureDates.length ? "" : '<p style="color:var(--muted); font-size:13px;">Saison ist vorbei – alle Termine stehen unten.</p>'}
    <div class="only-desktop">${table(futureDates)}</div>
    <div class="only-mobile">${buildCards(futureDates, derived)}</div>
    ${pastBlock}
  </div>`;
}

/* ===================== DIALOG: GAST / MITGLIED ===================== */
function openExtraDialog(d, opts){
  const dlg = document.getElementById("extraDlg");
  const existing = opts.key ? extrasOf(d).find(x => x.key === opts.key) : null;
  let typ = existing ? existing.typ : opts.typ;
  const taken = new Set(extrasOf(d).filter(x => x.memberId && (!existing || x.key !== existing.key)).map(x => x.memberId));
  const members = Object.entries(MST.directory)
    .filter(([id, m]) => !FIXED_IDS.includes(id) && !taken.has(id) && !m.left)
    .sort((a,b) => a[1].name.localeCompare(b[1].name, "de"));
  const defaultMember = existing ? existing.memberId : (!FIXED_IDS.includes(me.id) && !me.admin ? me.id : "");
  const defaultPaid = existing ? (existing.paidTo || "") : "";
  const draw = () => {
    dlg.innerHTML = `
      <h3>${existing ? "Bearbeiten" : "Mitspieler eintragen"}</h3>
      <p class="dlg-sub">${dateD1(d)} · zahlt ${chf(PER_PLAYER_COST)}, wenn er/sie spielt</p>
      <form method="dialog" id="extraForm">
        <div class="seg">
          <label class="${typ==="gast"?"on":""}"><input type="radio" name="typ" value="gast" ${typ==="gast"?"checked":""}>Gast</label>
          <label class="${typ==="mitglied"?"on":""}"><input type="radio" name="typ" value="mitglied" ${typ==="mitglied"?"checked":""}>MST-Mitglied</label>
        </div>
        ${typ==="gast"
          ? `<label>Name des Gasts<input name="name" required maxlength="40" value="${existing && existing.typ==="gast" ? esc(existing.name) : ""}" placeholder="z. B. Marco"></label>`
          : `<label>Mitglied<select name="memberId" required>
               <option value="">– auswählen –</option>
               ${members.map(([id,m]) => `<option value="${id}" ${id===defaultMember?"selected":""}>${esc(m.name)}</option>`).join("")}
             </select></label>`}
        <label>Bezahlt an (bar)<select name="paidTo">
          <option value="">noch offen</option>
          ${FIXED.map(f => `<option value="${f.id}" ${f.id===defaultPaid?"selected":""}>${esc(f.short)}</option>`).join("")}
        </select></label>
        <div class="dlg-actions">
          ${existing ? `<button class="btn-danger" type="button" id="extraDel">Entfernen</button>` : ""}
          <div class="right">
            <button class="btn-ghost" type="button" id="extraCancel">Abbrechen</button>
            <button class="btn-primary" type="submit">Speichern</button>
          </div>
        </div>
      </form>`;
    dlg.querySelectorAll('input[name="typ"]').forEach(r => r.onchange = () => { typ = r.value; draw(); });
    dlg.querySelector("#extraCancel").onclick = () => dlg.close();
    const del = dlg.querySelector("#extraDel");
    if(del) del.onclick = () => {
      const usedInBeer = beers.some(b => b.date === d && (b.drinkers||[]).includes(existing.key));
      if(usedInBeer && !confirm("Dieser Gast ist in einer Bierrunde eingetragen. Trotzdem entfernen?")) return;
      dlg.close();
      write(daysCol.doc(d).update({ ["extras." + existing.key]: FV.delete() }), `${dateD1(d)}: ${extraLabel(existing)} entfernt`);
    };
    dlg.querySelector("#extraForm").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      const entry = { typ, ts: existing ? existing.ts : Date.now(), paidTo: f.paidTo.value || null, by: me.id };
      if(typ === "gast"){
        entry.name = f.name.value.trim();
        if(!entry.name) return;
      } else {
        entry.memberId = f.memberId.value;
        if(!entry.memberId) return;
        entry.name = (MST.directory[entry.memberId] || {}).name || entry.memberId;
      }
      const key = existing ? existing.key : "x_" + Math.random().toString(36).slice(2, 10);
      dlg.close();
      write(daysCol.doc(d).set({ extras: { [key]: entry } }, { merge:true }),
        `${dateD1(d)}: ${extraLabel(entry)} ${existing ? "geändert" : "eingetragen"}, bezahlt an ${entry.paidTo ? fixName(entry.paidTo) : "offen"}`);
    };
  };
  draw();
  dlg.showModal();
}

/* ===================== TAB: BIERRUNDEN ===================== */
let beerDraft = null; // { date, payer, amount, note, drinkers:Set }
function beerDates(){
  const today = todayISO();
  return SESSIONS.filter(d => !VENUE_CANCELLED[d] && d <= today).reverse();
}
function defaultDrinkers(derived, d){
  const s = derived.perSession[d];
  return new Set(s && s.quorum ? s.confirmed : []);
}

  if(!beerDraft){
    const d = dates[0] || SESSIONS[0];

                  ...extrasOf(beerDraft.date).map(x => ({ id:x.key, label:extraLabel(x) }))];

      <form id="beerForm">
        <div class="beer-form">
          <label>Datum<select name="date">${dates.map(d => `<option value="${d}" ${d===beerDraft.date?"selected":""}>${dateD1(d)}</option>`).join("")}</select></label>
          <label>Bezahlt von<select name="payer" required>
            <option value="">– wer? –</option>
            ${FIXED.map(f => `<option value="${f.id}" ${f.id===beerDraft.payer?"selected":""}>${esc(f.short)}</option>`).join("")}
          </select></label>
          <label>Betrag (CHF)<input name="amount" inputmode="decimal" required value="${esc(beerDraft.amount)}" placeholder="z. B. 32.50"></label>
          <label>Bemerkung<input name="note" maxlength="60" value="${esc(beerDraft.note)}" placeholder="optional"></label>
        </div>
        <div class="drinkers">
          ${people.map(p => `<label class="drinker ${beerDraft.drinkers.has(p.id)?"on":""}"><input type="checkbox" name="drinker" value="${p.id}" ${beerDraft.drinkers.has(p.id)?"checked":""}>${esc(p.label)}</label>`).join("")}
        </div>
        <p class="rule-note" style="margin:6px 0 12px;">${n ? `${n} Personen · je ${chf(amt / n)}` : "Wer hat mitgetrunken?"}${sess && sess.quorum ? "" : " · An diesem Termin steht noch keine 4er-Gruppe fest."}</p>
        <button class="btn-primary" type="submit">Bierrunde speichern</button>
      </form>
    </div>`;
  const list = beers.length ? `<ul class="beer-list">${beers.map(b => {
      const canDel = me.admin || (canEdit() && b.by === me.id);
      const per = (b.drinkers||[]).length ? b.amount / b.drinkers.length : 0;
      return `<li>
        <div>
          <div><b>${esc(fixName(b.payer))}</b> hat bezahlt · ${dateD1(b.date)}${b.note ? ` · ${esc(b.note)}` : ""}</div>
          <div class="meta">${(b.drinkers||[]).map(id => esc(participantName(b.date, id))).join(", ")} · je ${chf(per)}</div>
        </div>
        <div><span class="amt">${chf(Number(b.amount)||0)}</span>${canDel ? `<button class="del-btn" data-action="del-beer" data-id="${b.id}">Löschen</button>` : ""}</div>
      </li>`;
    }).join("")}</ul>` : `<p class="rule-note" style="margin:0;">Noch keine Bierrunden erfasst.</p>`;
  const total = beers.reduce((s,b) => s + (Number(b.amount)||0), 0);
  return (canEdit() ? form : "") + `
    <div class="card">
      <h3>Bisherige Bierrunden · total ${chf(total)}</h3>
      ${list}
    </div>`;
}

function computeSettlements(net){
  const creditors = [], debtors = [];
  for(const p of FIXED_IDS){
    const v = Math.round((net[p]||0)*100)/100;
    if(v > 0.05) creditors.push({player:p, amount:v});
    else if(v < -0.05) debtors.push({player:p, amount:-v});
  }
  creditors.sort((a,b)=>b.amount-a.amount);
  debtors.sort((a,b)=>b.amount-a.amount);
  const tx = []; let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].amount, creditors[j].amount);
    if(pay > 0.05) tx.push({from:debtors[i].player, to:creditors[j].player, amount:pay});
    debtors[i].amount -= pay; creditors[j].amount -= pay;
    if(debtors[i].amount <= 0.05) i++;
    if(creditors[j].amount <= 0.05) j++;
  }
  return tx;
}
function renderStatistikTab(derived){
  const share = upfrontShare();
  const rows = FIXED.map(f => ({ id:f.id, name:f.short, games: derived.games[f.id], court: derived.court[f.id] }))
    .sort((a,b) => a.games - b.games);
  const totalGames = rows.reduce((s,r)=>s+r.games,0) + derived.extraLedger.filter(r => r.court>0).length;
  const rank = `
  <div class="card">
    <h3>Rangliste – wenigste Spiele oben (hat Vorrang)</h3>
    <div class="tbl-scroll"><table class="stats">
      <thead><tr><th>Spieler</th><th class="num">Spiele</th><th class="num">Feldkosten</th></tr></thead>
      <tbody>${rows.map((r,i) => `<tr><td><span class="rank-badge">${i+1}</span>${esc(r.name)}</td><td class="num">${r.games}</td><td class="num">${chf(r.court)}</td></tr>`).join("")}

    ${totalCancelledSessions() ? `<p class="rule-note" style="margin-top:10px;">${totalCancelledSessions()} abgesagte Termine: alle ${FIXED.length} Fixen tragen je ${chf(CANCELLED_SHARE)} – oben eingerechnet.</p>` : ""}
  </div>`;

  const guests = derived.extraLedger.length ? `
  <div class="card">
    <h3>Gäste & Mitglieder</h3>
    <div class="tbl-scroll"><table class="stats">
      <thead><tr><th>Datum</th><th>Wer</th><th class="num">Feld</th><th class="num">Bier</th><th class="num">Total</th><th>Bezahlt an</th></tr></thead>
      <tbody>${derived.extraLedger.map(r => `<tr>
        <td>${dateD1(r.date)}</td><td>${esc(r.label)}</td>
        <td class="num">${r.court ? chf(r.court) : "–"}</td><td class="num">${r.beer ? chf(r.beer) : "–"}</td>
        <td class="num">${chf(r.court + r.beer)}</td>
        <td class="${r.paidTo ? "" : "owed-red"}">${r.paidTo ? esc(fixName(r.paidTo)) : "offen"}</td></tr>`).join("")}
      </tbody>
    </table></div>
  </div>` : "";

  const net = computeNet(derived);
  const settleRows = [...FIXED].sort((a,b) => net[a.id]-net[b.id]).map(f => {
    const p = f.id, n = net[p];
    const cls = n < -0.05 ? "owed-red" : (n > 0.05 ? "owed-green" : "");
    const label = n < -0.05 ? `zahlt ${chf(-n)}` : (n > 0.05 ? `+ ${chf(n)}` : "ausgeglichen");
    const beerNet = derived.beerPaid[p] - derived.beerShare[p];
    return `<tr>
      <td>${esc(f.short)}</td>
      <td class="num">${chf(share)}</td>
      <td class="num">− ${chf(derived.court[p])}</td>
      <td class="num">${derived.collected[p] ? "− " + chf(derived.collected[p]) : "–"}</td>
      <td class="num">${Math.abs(beerNet) > 0.004 ? (beerNet > 0 ? "+ " : "− ") + chf(Math.abs(beerNet)) : "–"}</td>
      <td class="num ${cls}">${label}</td>
    </tr>`;
  }).join("");
  const tx = computeSettlements(net);
  const txHtml = tx.length
    ? `<ul class="settle-list">${tx.map(t => `<li><b>${esc(fixName(t.from))}</b> zahlt <b>${chf(t.amount)}</b> an <b>${esc(fixName(t.to))}</b></li>`).join("")}</ul>`
    : `<p class="rule-note" style="margin:0;">Aktuell nichts auszugleichen.</p>`;
  const open = derived.openItems.length
    ? `<div class="warn"><b>Noch offen:</b><br>${derived.openItems.map(esc).join("<br>")}</div>` : "";
  const unresolved = derived.unresolvedCount
    ? `<p class="rule-note" style="margin-top:10px;">${derived.unresolvedCount} Termine stehen noch nicht fest (weder gespielt noch abgesagt) – dafür ist noch Guthaben aus der Startzahlung reserviert.</p>` : "";
  return rank + guests + `
  <div class="card">
    <h3>Schlussabrechnung der ${FIXED.length} Fixen</h3>
    <p class="rule-note" style="margin-bottom:14px;">Startzahlung je ${chf(share)} (1/7 von ${chf(totalGroupShare())}). Davon gehen ab: eigene Feldkosten und Geld, das man von Gästen/Mitgliedern bar bekommen hat. Bierrunden: bezahlt = Gutschrift, mitgetrunken = Anteil. Läuft laufend mit.</p>
    ${open}
    <div class="tbl-scroll"><table class="stats">
      <thead><tr><th>Spieler</th><th class="num">Einbezahlt</th><th class="num">Feld</th><th class="num">Von Gästen</th><th class="num">Bier ±</th><th class="num">Saldo</th></tr></thead>
      <tbody>${settleRows}</tbody>
    </table></div>
    <h3 style="margin-top:20px;">Wer zahlt wem</h3>
    ${txHtml}
    ${unresolved}
  </div>`;
}

/* ===================== ADMIN: SAISON VERWALTEN ===================== */
let seasonMode = "edit"; // "edit" = angezeigte Saison bearbeiten, "new" = neue Saison anlegen
function shiftYear(iso){ const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 364); return d.toISOString().slice(0,10); }
function nextSeasonId(id){ const m = id.match(/^(\d{4})-(\d\d)$/); return m ? `${+m[1]+1}-${String((+m[2]+1)%100).padStart(2,"0")}` : ""; }
function renderSeasonAdmin(){
  const isNew = seasonMode === "new";
  const c = isNew
    ? { ...CFG, start:shiftYear(CFG.start), end:shiftYear(CFG.end), venueCancelled:{}, note:"" }
    : CFG;
  const id = isNew ? nextSeasonId(CURRENT_SEASON || SEASON) : SEASON;
  const fixedIds = new Set((c.fixed || []).map(f => f.id));
  const members = Object.entries(MST.directory).sort((a,b) => a[1].name.localeCompare(b[1].name, "de"));
  const ausfall = Object.entries(c.venueCancelled || {}).sort().map(([d,r]) => `${d} ${r}`).join("\n");
  return `
  <div class="card admin-card">
    <h3>Admin · Saison verwalten</h3>
    <div class="seg" style="margin-bottom:14px;">
      <label class="${!isNew?"on":""}"><input type="radio" name="smode" value="edit" ${!isNew?"checked":""}>${esc(seasonLabel(SEASON))} bearbeiten</label>
      <label class="${isNew?"on":""}"><input type="radio" name="smode" value="new" ${isNew?"checked":""}>Neue Saison anlegen</label>
    </div>
    <form id="seasonForm" class="season-form">
      <div class="beer-form">
        <label>Saison (Jahr-Jahr)<input name="id" value="${esc(id)}" pattern="\\d{4}-\\d{2}" required ${isNew?"":"readonly"}></label>
        <label>Erster Termin<input name="start" type="date" value="${c.start}" required></label>
        <label>Letzter Termin<input name="end" type="date" value="${c.end}" required></label>
        <label>Ort<input name="place" value="${esc(c.place)}" required></label>
        <label>Zeit<input name="time" value="${esc(c.time)}" required></label>
        <label>Preis pro Stunde (CHF)<input name="hourlyRate" inputmode="decimal" value="${c.hourlyRate}" required></label>
        <label>Stunden pro Termin<input name="hours" inputmode="decimal" value="${c.hours}" required></label>
        <label>Vereinsanteil (%)<input name="clubPct" inputmode="decimal" value="${Math.round(c.clubPct*1000)/10}" required></label>
      </div>
      <p class="my-lbl" style="margin:16px 0 6px;">Die Fixen (zahlen im Voraus, rechnen am Schluss ab)</p>
      <div class="drinkers">${members.map(([mid,m]) => `<label class="drinker ${fixedIds.has(mid)?"on":""}"><input type="checkbox" name="fixed" value="${mid}" ${fixedIds.has(mid)?"checked":""}>${esc(m.short)}</label>`).join("")}</div>
      <label style="margin-top:12px;">Ausfälle der Halle (eine Zeile pro Termin: JJJJ-MM-TT Grund)<textarea name="ausfall" rows="4">${esc(ausfall)}</textarea></label>
      <label style="margin-top:12px;">Bemerkung zur Abrechnung<input name="note" value="${esc(c.note || "")}" placeholder="z. B. Basis: Rechnung Nr. … vom …"></label>
      <p class="rule-note" style="margin:12px 0;">${isNew
        ? "Die neue Saison wird sofort die aktuelle. Die bisherige bleibt als Archiv lesbar (oben auswählbar)."
        : "Achtung: Preise oder Fixe mitten in der Saison zu ändern, ändert die ganze Abrechnung rückwirkend."}</p>
      <button class="btn-primary" type="submit">${isNew ? "Neue Saison anlegen" : "Änderungen speichern"}</button>
    </form>
  </div>`;
}
function bindSeasonForm(f){
  document.querySelectorAll('input[name="smode"]').forEach(r => r.onchange = () => { seasonMode = r.value; render(); });
  f.querySelectorAll('input[name="fixed"]').forEach(cb => cb.onchange = () => cb.parentElement.classList.toggle("on", cb.checked));
  f.onsubmit = async (e) => {
    e.preventDefault();
    const num = v => parseFloat(String(v).replace(",", "."));
    const venueCancelled = {};
    for(const line of f.ausfall.value.split("\n")){
      const m = line.trim().match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/);
      if(m) venueCancelled[m[1]] = m[2] || "Ausfall der Halle";
      else if(line.trim()){ alert("Diese Ausfall-Zeile verstehe ich nicht: " + line); return; }
    }
    const fixed = [...f.querySelectorAll('input[name="fixed"]:checked')].map(cb => ({ id:cb.value, short:MST.nameOf(cb.value) }));
    // bisherige Reihenfolge der Fixen beibehalten
    const order = (CFG.fixed || []).map(x => x.id);
    fixed.sort((a,b) => ((order.indexOf(a.id)+1) || 99) - ((order.indexOf(b.id)+1) || 99));
    const cfg = {
      start:f.start.value, end:f.end.value, place:f.place.value.trim(), time:f.time.value.trim(),
      hourlyRate:num(f.hourlyRate.value), hours:num(f.hours.value), clubPct:num(f.clubPct.value)/100,
      fixed, venueCancelled, note:f.note.value.trim()
    };
    const id = f.id.value.trim();
    if(!/^\d{4}-\d{2}$/.test(id)){ alert("Saison bitte als Jahr-Jahr, z. B. 2027-28."); return; }
    if(cfg.end < cfg.start || !(cfg.hourlyRate > 0) || !(cfg.hours > 0) || !(cfg.clubPct >= 0)){ alert("Bitte Daten und Zahlen prüfen."); return; }
    if(!fixed.length){ alert("Bitte mindestens einen Fixen auswählen."); return; }
    const isNew = seasonMode === "new";
    if(isNew && seasonsList.some(x => x.id === id)){ alert(`${seasonLabel(id)} gibt es schon.`); return; }
    if(isNew && !confirm(`${seasonLabel(id)} anlegen und zur aktuellen Saison machen?`)) return;
    try{
      await db.collection("padel").doc(id).set(cfg);
      if(isNew) await db.collection("config").doc("padel").set({ currentSeason:id }, { merge:true });
      MST.log("padel", `${seasonLabel(id)} ${isNew ? "angelegt (jetzt aktuell)" : "bearbeitet"}`, { season:id });
      if(isNew) CURRENT_SEASON = id;
      const i = seasonsList.findIndex(x => x.id === id);
      if(i >= 0) seasonsList[i].cfg = cfg; else seasonsList.push({ id, cfg });
      seasonsList.sort((a,b) => b.id.localeCompare(a.id));
      seasonMode = "edit";
      openSeason(id);
    }catch(err){ console.error(err); alert("Speichern fehlgeschlagen."); }
  };
}

/* ===================== EVENTS ===================== */
function attachHandlers(derived){
  document.querySelectorAll(".tabbtn").forEach(btn => btn.addEventListener("click", () => { currentTab = btn.dataset.tab; render(); }));
  const sf = document.getElementById("seasonForm");
  if(sf) bindSeasonForm(sf);
  const ss = document.getElementById("seasonSelect");
  if(ss) ss.onchange = () => openSeason(ss.value);
  const panel = document.getElementById("panelContent");
  panel.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if(!t || t.disabled) return;
    const action = t.dataset.action, d = t.dataset.date;
    if(action === "toggle-avail"){
      const p = t.dataset.player;
      if(!canEditFix(p)) return;
      const cur = (days[d] || {})[p];
      let next;
      if(withinRegistrationWindow(d) || me.admin){
        next = cur === undefined ? Date.now() : (typeof cur === "number" ? "declined" : null);
      } else {
        next = cur === undefined ? "declined" : null;
      }
      if(next === null && !days[d]) return;
      write(daysCol.doc(d).set({ [p]: next === null ? FV.delete() : next }, { merge:true }),
        `${dateD1(d)}: ${fixName(p)} → ${next === null ? "leer" : (next === "declined" ? "kann nicht" : "kann")}`);
    } else if(action === "set-own"){
      const v = t.dataset.val;
      const next = v === "clear" ? null : (v === "declined" ? "declined" : Date.now());
      if(next === null && !days[d]) return;
      write(daysCol.doc(d).set({ [me.id]: next === null ? FV.delete() : next }, { merge:true }),
        `${dateD1(d)}: ${fixName(me.id)} → ${next === null ? "leer" : (next === "declined" ? "kann nicht" : "kann")}`);
    } else if(action === "toggle-cancel"){
      if(!me.admin) return;
      const on = !(days[d] && days[d].cancelled);
      if(on && !confirm(`Termin ${dateD1(d)} absagen? Dann tragen alle ${FIXED.length} Fixen die Kosten.`)) return;
      write(daysCol.doc(d).set({ cancelled: on }, { merge:true }), `${dateD1(d)}: Termin ${on ? "abgesagt" : "reaktiviert"}`);
    } else if(action === "add-extra"){
      openExtraDialog(d, { typ: t.dataset.typ });
    } else if(action === "edit-extra"){
      openExtraDialog(d, { key: t.dataset.key });
    } else if(action === "del-beer"){
      const b = beers.find(x => x.id === t.dataset.id);
      if(confirm("Bierrunde löschen?")) write(beerCol.doc(t.dataset.id).delete(), `Bierrunde ${dateD1(b.date)} von ${fixName(b.payer)} (${chf(Number(b.amount)||0)}) gelöscht`);
    }
  });

  const bf = document.getElementById("beerForm");
  if(bf){
    bf.date.onchange = () => { beerDraft.date = bf.date.value; beerDraft.drinkers = defaultDrinkers(derived, beerDraft.date); render(); };
    bf.payer.onchange = () => { beerDraft.payer = bf.payer.value; };
    bf.amount.oninput = () => { beerDraft.amount = bf.amount.value; };
    bf.amount.onchange = () => render();
    bf.note.oninput = () => { beerDraft.note = bf.note.value; };
    bf.querySelectorAll('input[name="drinker"]').forEach(cb => cb.onchange = () => {
      cb.checked ? beerDraft.drinkers.add(cb.value) : beerDraft.drinkers.delete(cb.value);
      render();
    });
    bf.onsubmit = (e) => {
      e.preventDefault();
      const amount = Math.round((parseFloat(String(beerDraft.amount).replace(",", ".")) || 0) * 100) / 100;
      if(!beerDraft.payer){ alert("Wer hat bezahlt?"); return; }
      if(!(amount > 0)){ alert("Bitte einen Betrag eingeben."); return; }
      if(!beerDraft.drinkers.size){ alert("Bitte ankreuzen, wer mitgetrunken hat."); return; }
      const entry = { date:beerDraft.date, payer:beerDraft.payer, amount, drinkers:[...beerDraft.drinkers], note:beerDraft.note.trim(), by:me.id, at:Date.now() };
      beerDraft = null;
      write(beerCol.add(entry), `Bierrunde ${dateD1(entry.date)}: ${fixName(entry.payer)} zahlt ${chf(amount)} für ${entry.drinkers.length} Personen`);
    };
  }
}
