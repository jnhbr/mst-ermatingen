<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spieltag · MST Ermatingen</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" href="../assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141311">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mst.css?v=202610042100">
<link rel="stylesheet" href="../css/spieltag.css?v=202610042100">
<style>
  /* ---------- Spiele-Übersicht ---------- */
  .cat-title{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--yellow); margin:18px 0 8px;}
  .cat-title:first-child{margin-top:0;}
  .games{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:10px;}
  .gcard{position:relative; display:flex; flex-direction:column; gap:6px; padding:14px 16px; border-radius:var(--radius); background:var(--bg-elev); border:1px solid var(--line); color:var(--white); text-decoration:none; cursor:pointer;}
  .gcard:hover{border-color:var(--yellow);}
  .gcard-head{display:flex; align-items:center; gap:10px;}
  .gcard-icon{font-size:24px; line-height:1;}
  .gcard-name{font-family:var(--font-display); font-size:18px; text-transform:uppercase; font-weight:600; flex:1; min-width:0;}
  .gcard-sub{font-size:12.5px; color:var(--muted);}
  .gcard-lead{font-size:12.5px; color:var(--white);}
  .gcard-lead b{color:var(--yellow);}
  .gcard-admin{display:flex; gap:6px; margin-top:4px; flex-wrap:wrap;}
  .gcard-admin button{padding:4px 9px;}
  .add-game{display:flex; align-items:center; justify-content:center; min-height:90px; border:1px dashed var(--line-strong); border-radius:var(--radius); color:var(--muted); background:none; cursor:pointer; font-size:14px;}
  .add-game:hover{border-color:var(--yellow); color:var(--yellow);}

  /* ---------- Spiel-Detail ---------- */
  .back{display:inline-block; margin:0 0 10px; font-size:13px; color:var(--muted); text-decoration:none;}
  .back:hover{color:var(--yellow);}
  .game-head{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
  .game-head .gicon{font-size:38px;}
  .game-head h2{font-family:var(--font-display); text-transform:uppercase; font-size:clamp(22px,5vw,32px); margin:0; line-height:1;}
  .game-head .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .admin-bar{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px;}
  .notice{border:1px solid var(--yellow); background:var(--yellow-soft); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin:0 0 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between;}
  .notice.red{border-color:var(--red); background:var(--red-soft);}
  .split{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr)); gap:12px; align-items:start;}

  .units{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr)); gap:8px;}
  .unit{background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 10px; font-size:13px;}
  .unit.mine{border-color:var(--yellow);}
  .unit-name{font-family:var(--font-display); text-transform:uppercase; font-size:12px; color:var(--yellow); letter-spacing:.04em;}
  .unit-name small{color:var(--muted); font-family:var(--font-mono); text-transform:none; letter-spacing:0;}
  .unit-m{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:2px 0;}
  .unit-m select{padding:2px 4px; font-size:11.5px; max-width:110px;}

  .match{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .match:last-child{border-bottom:none;}
  .match .ma{text-align:right;}
  .match .win{color:var(--yellow); font-weight:600;}
  .match .lose{color:var(--muted);}
  .match-meta{grid-column:1/-1; text-align:center; font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2); margin-top:-4px;}
  .score{display:flex; align-items:center; gap:4px; font-family:var(--font-mono);}
  .score input{width:46px; padding:5px 4px; text-align:center; font-size:14px; font-family:var(--font-mono);}
  .score .res{min-width:58px; text-align:center; color:var(--white);}
  .score .res.open{color:var(--muted-2);}
  .wbtn{background:var(--bg); border:1px solid var(--line-strong); color:var(--white); border-radius:6px; padding:5px 8px; cursor:pointer; font-size:13px; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  .wbtn.win{background:var(--yellow); color:#141311; border-color:var(--yellow); font-weight:700;}
  .round-title{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:12px 0 2px;}
  .round-title:first-child{margin-top:0;}

  /* K.o.-Raster */
  .bracket{display:flex; gap:14px; overflow-x:auto; padding-bottom:8px;}
  .bcol{display:flex; flex-direction:column; justify-content:space-around; gap:10px; min-width:210px;}
  .bcol-title{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--yellow); text-align:center;}
  .bmatch{background:var(--bg); border:1px solid var(--line-strong); border-radius:var(--radius-sm); overflow:hidden; font-size:13px;}
  .bmatch.bye{opacity:.45; border-style:dashed;}
  .bslot{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 8px;}
  .bslot + .bslot{border-top:1px solid var(--line);}
  .bslot .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bslot.win .nm{color:var(--yellow); font-weight:600;}
  .bslot.lose .nm{color:var(--muted);}
  .bslot .sc{font-family:var(--font-mono);}
  .bslot input{width:42px; padding:3px; text-align:center; font-family:var(--font-mono); font-size:13px;}
  .bslot.tbd .nm{color:var(--muted-2); font-style:italic;}
  .bslot button.wbtn{padding:2px 7px; font-size:11px;}

  /* Tabellen */
  table.rank input{width:64px; padding:5px 6px; text-align:right; font-family:var(--font-mono); font-size:13.5px;}
  table.rank th.gh{white-space:normal; font-size:10px; line-height:1.2; min-width:52px; max-width:76px; vertical-align:bottom;}
  table.rank th.gh a{color:inherit; text-decoration:none;}
  table.rank th.gh a:hover{color:var(--yellow);}
  table.rank tr.me td{background:rgba(255,241,57,.06);}
  .champ{font-size:10px; font-family:var(--font-mono); color:var(--yellow); border:1px solid var(--yellow); border-radius:4px; padding:0 4px; margin-left:6px; vertical-align:middle;}
  .card-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .card-head h3{margin:0;}

  /* Startkarten oben (Anmeldung, Mein Spieltag, Stationen) */
  .top-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:12px; margin-bottom:12px;}
  .top-cards .card + .card{margin-top:0;}
  .big-next{font-family:var(--font-display); text-transform:uppercase; font-size:20px; line-height:1.15; margin:2px 0 4px;}
  .big-next b{color:var(--yellow);}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .ok{color:var(--green);}

  /* Zeitplan */
  .tl-row{display:grid; grid-template-columns:96px 28px 1fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .tl-row:last-child{border-bottom:none;}
  .tl-time{font-family:var(--font-mono); color:var(--yellow); font-size:13px;}
  .tl-time small{color:var(--muted-2);}
  .tl-row .sub{font-size:12px; color:var(--muted);}
  .tl-row.click{cursor:pointer;} .tl-row.click:hover .tl-name{color:var(--yellow);}
  .tl-row.done{opacity:.55;}
  .tl-edit{display:grid; grid-template-columns:28px 1fr 92px 1fr 70px 70px; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .tl-edit input{padding:6px 8px; font-size:13px; width:100%;}
  .tl-edit.head{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid var(--line-strong);}
  @media (max-width:640px){ .tl-edit{grid-template-columns:28px 1fr 1fr;} .tl-edit.head{display:none;} .tl-row{grid-template-columns:70px 24px 1fr;} .tl-row .chip{display:none;} }

  /* Bierkapitän */
  .beer-btns{display:flex; gap:10px; flex-wrap:wrap; margin:8px 0;}
  .beer-btn{flex:1; min-width:120px; font-size:20px; padding:16px 10px;}
  .beer-sum{font-family:var(--font-mono); font-size:28px; color:var(--yellow); font-weight:700;}
  .beer-log li{display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .beer-log ul{list-style:none; margin:0; padding:0; max-height:260px; overflow:auto;}

  /* Historie */
  .hist-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; align-items:start;}
  .hist-grid .card + .card{margin-top:12px;}
  .year-pills{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .matrix td.y{text-align:center; font-family:var(--font-mono); color:var(--muted-2);}
  .matrix td.y.on{color:var(--yellow);}
  .list-plain{list-style:none; margin:0; padding:0;}
  .list-plain li{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .list-plain li:last-child{border-bottom:none;}
  .list-plain .yr{font-family:var(--font-mono); color:var(--muted);}
  .list-plain b{color:var(--yellow); font-weight:600;}
  .rec-title{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:14px 0 2px;}
  .rec-title:first-child{margin-top:0;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}

  /* ---------- TV-Ansicht ---------- */
  body.tv-mode{overflow:hidden;}
  body.tv-mode #app{max-width:none; padding:0;}
  .tv{position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; padding:2.2vh 2.6vw; gap:1.6vh; background:radial-gradient(1400px 700px at 10% -10%, rgba(255,241,57,.09), transparent 60%), var(--bg);}
  .tv-head{display:flex; align-items:center; gap:2vw;}
  .tv-head img{height:9vh;}
  .tv-title{font-family:var(--font-display); text-transform:uppercase; font-size:5vh; line-height:1; font-weight:700;}
  .tv-eyebrow{font-family:var(--font-mono); color:var(--yellow); letter-spacing:.14em; font-size:1.6vh; text-transform:uppercase;}
  .tv-clock{margin-left:auto; font-family:var(--font-mono); font-size:5vh; color:var(--yellow); font-weight:700;}
  .tv-close{position:absolute; top:1vh; right:1vw; background:none; border:none; color:var(--muted-2); font-size:18px; cursor:pointer;}
  .tv-main{display:grid; grid-template-columns:1fr 22vh; gap:2vw; min-height:0;}
  .tv-panel{min-height:0; overflow:hidden; background:var(--bg-elev); border:1px solid var(--line); border-radius:16px; padding:2.4vh 2vw;}
  .tv-panel h2{font-family:var(--font-display); text-transform:uppercase; margin:0 0 1.6vh; font-size:3.4vh; color:var(--yellow); letter-spacing:.03em;}
  .tv-cols{columns:2; column-gap:3vw;}
  .tv-row{display:grid; grid-template-columns:5vh 1fr auto; gap:1vw; align-items:center; font-size:2.6vh; padding:.55vh 0; border-bottom:1px solid var(--line); break-inside:avoid;}
  .tv-row .p{font-family:var(--font-mono); color:var(--muted);}
  .tv-row .t{font-family:var(--font-mono); font-weight:700;}
  .tv-row.first .n, .tv-row.first .p{color:var(--yellow); font-weight:700;}
  .tv-match{display:grid; grid-template-columns:12vh 1fr; gap:1.5vw; font-size:2.5vh; padding:.8vh 0; border-bottom:1px solid var(--line);}
  .tv-match .tm{font-family:var(--font-mono); color:var(--yellow);}
  .tv-match small{color:var(--muted); font-size:1.9vh;}
  .tv-side{display:flex; flex-direction:column; gap:1.4vh; align-items:center; justify-content:flex-end; text-align:center;}
  .tv-qr{background:#fff; padding:1.2vh; border-radius:12px; line-height:0;}
  .tv-qr img, .tv-qr canvas{width:18vh !important; height:18vh !important;}
  .tv-side p{font-size:1.8vh; color:var(--muted); margin:0;}
  .tv-dots{display:flex; gap:8px; justify-content:center;}
  .tv-dots span{width:10px; height:10px; border-radius:50%; background:var(--line-strong);}
  .tv-dots span.on{background:var(--yellow);}
  .tv-big{font-family:var(--font-display); font-size:7vh; text-transform:uppercase; color:var(--yellow); line-height:1;}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="app"><div class="loading">lade Spieltag …</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../js/mst.js?v=202610042100" data-base="../"></script>
<script src="../js/spieltag-engine.js?v=202610042100"></script>
<script src="../js/spieltag-stats.js?v=202610042100"></script>
<script src="../js/spieltag-data.js?v=202610042100"></script>
<script src="../js/spieltag-ui.js?v=202610042100"></script>
<script src="../js/kalender.js?v=202610042100"></script>

</body>
</html>
