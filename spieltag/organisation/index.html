<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spieltag-Organisation · MST Ermatingen</title>
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="icon" href="../../assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141311">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/mst.css?v=202610041700">
<link rel="stylesheet" href="../../css/spieltag.css?v=202610041700">
<style>
  .two-col{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:12px; align-items:start;}
  @media (max-width:860px){ .two-col{grid-template-columns:1fr;} }
  .count-big{font-family:var(--font-mono); font-size:34px; font-weight:700; color:var(--yellow); line-height:1;}
  .count-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px;}
  .plist{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr)); gap:6px;}
  .pitem{display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); cursor:pointer; font-size:13.5px; text-transform:none; letter-spacing:0; color:var(--white); flex-direction:row;}
  .pitem input{width:17px; height:17px; accent-color:var(--yellow); padding:0; margin:0;}
  .pitem.on{border-color:var(--yellow); background:var(--yellow-soft);}
  .pitem .meta{margin-left:auto; font-size:10.5px; color:var(--muted-2); font-family:var(--font-mono);}
  .group-title{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--yellow); margin:16px 0 8px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .group-title:first-child{margin-top:0;}
  .inline-form{display:flex; gap:8px; flex-wrap:wrap; align-items:end;}
  .inline-form input{padding:8px 10px; font-size:14px;}
  .fit-row{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:flex-start;}
  .fit-row:last-child{border-bottom:none;}
  .fit-row .ic{font-size:18px; width:24px; text-align:center;}
  .fit-row .nm{font-weight:600;}
  .fit-row .d{color:var(--muted); font-size:12.5px;}
  .fit-row .w{color:var(--red); font-size:12px;}
  .grid-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; align-items:end;}
  .grid-form input, .grid-form select{padding:8px 10px; font-size:14px; width:100%;}
  .catlist .fit-row{cursor:pointer;}
  .catlist .fit-row:hover .nm{color:var(--yellow);}
  .tag{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line-strong); border-radius:4px; padding:1px 5px; margin-left:6px;}
  .tag.y{color:var(--yellow); border-color:var(--yellow);}
  .muted{color:var(--muted);} .small{font-size:12px;}
  .search{max-width:220px; padding:7px 10px; font-size:13.5px;}
</style>
</head>
<body>
<div id="gate"><div class="loading">lade …</div></div>
<div id="app"><div class="loading">lade …</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../js/mst.js?v=202610041700" data-base="../../"></script>
<script src="../../js/spieltag-engine.js?v=202610041700"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../js/spieltag-stats.js?v=202610041700"></script>
<script src="../../js/spieltag-data.js?v=202610041700"></script>
<script src="../../js/spieltag-ui.js?v=202610041700"></script>
<script src="../../js/kalender.js?v=202610041700"></script>
<script>
/* ===================== Spieltag-Organisation (nur Admin) =====================
   Teilnehmende des Jahres, Personen (Mitglieder + Gäste), Grundgerüst der
   Disziplinen und Spieltage anlegen/abschliessen. Was hier geändert wird,
   sieht die Spieltag-Seite sofort. */
const E = SpieltagEngine, D = SpieltagData;
let me = null, tab = "teilnehmende", filter = "";
let settings = {}, YEAR = null, years = [], yearDoc = null, gameData = {}, signups = {}, catalog = [], history = [], directory = {};
let unsubYear = [];
let calEvents = null;   // Google Kalender «MST» – liefert das Datum des Spieltags

if(D.test){
  document.getElementById("gate").hidden = true;
  start({ id:"test", name:"Test", admin:true });
} else {
  MST.start(user => start(user));
}

function start(user){
  me = user;
  if(!me.admin){
    document.getElementById("app").innerHTML = `<div class="topbar"><span class="crumbs"><a href="../../">MST Ermatingen</a> / Spieltag-Organisation</span><div id="userbar"></div></div>
      <div class="card" style="margin-top:20px"><h3>Nur für den Admin</h3><p class="muted">Die Organisation des Spieltags macht der Vorstand. Den Spieltag selbst siehst du unter <a href="../">Spieltag</a>.</p></div>`;
    MST.renderUserBar();
    return;
  }
  D.watchDoc("spieltagMeta/settings", s => { settings = s || {}; if(!YEAR || !years.includes(YEAR)) openYear(settings.currentYear || null); else draw(); });
  D.watchCollection("spieltag", docs => {
    years = docs.map(d => d.id).sort();
    if(!YEAR && years.length) openYear(settings.currentYear || years[years.length - 1]); else draw();
  });
  D.watchCollection("spieltagPersons", docs => { ST.persons = {}; docs.forEach(d => ST.persons[d.id] = d.data); draw(); });
  D.watchDoc("spieltagMeta/catalog", c => { catalog = (c && c.items) || []; draw(); });
  D.watchCollection("spieltagHistory", docs => { history = docs.map(d => d.data).sort((a, b) => a.year - b.year); draw(); });
  if(KAL.ready()) KAL.load(false).then(ev => { calEvents = ev; syncDate(); draw(); }).catch(e => console.warn("Kalender", e));
  if(!D.test) D.getCollection("memberDirectory").then(docs => { directory = {}; docs.forEach(d => directory[d.id] = d.data); draw(); }).catch(() => {});
}
function openYear(y){
  unsubYear.forEach(f => f()); unsubYear = [];
  YEAR = y; yearDoc = null; gameData = {}; signups = {};
  if(y){
    unsubYear.push(D.watchDoc(`spieltag/${y}`, d => { yearDoc = d; syncDate(); draw(); }));
    unsubYear.push(D.watchCollection(`spieltag/${y}/games`, docs => { gameData = {}; docs.forEach(d => gameData[d.id] = d.data); draw(); }));
    unsubYear.push(D.watchCollection(`spieltag/${y}/signups`, docs => { signups = {}; docs.forEach(d => signups[d.id] = d.data); draw(); }));
  }
  draw();
}
const calDay = () => calEvents && YEAR ? KAL.spieltagDay(calEvents, YEAR) : null;
function syncDate(){ if(!D.test && yearDoc) MST.syncSpieltagDate(YEAR, yearDoc, calDay()).catch(e => console.warn("Datum", e)); }
const participants = () => ST.effectiveParticipants(yearDoc, signups);
const signupOf = pid => Object.entries(signups).find(([, x]) => x.pid === pid);
const log = (text) => { if(!D.test) MST.log("spieltag", text); };

/* Statistik pro Person aus der Historie */
function personStats(){
  const st = {};
  history.forEach(y => (y.rows || []).forEach(r => (r.pids || []).forEach(pid => {
    const s = st[pid] = st[pid] || { n:0, last:null };
    s.n++; s.last = Math.max(s.last || 0, y.year);
  })));
  return st;   // laufende Jahre zählen erst nach dem Abschliessen
}

/* ---------- Gerüst ---------- */
let pending = false;
const notes = {};      // Meldungen, die ein Neuzeichnen überleben: elementId -> Text
function note(id, text){ notes[id] = text; const el = document.getElementById(id); if(el) el.textContent = text; }
document.addEventListener("focusout", () => setTimeout(() => { if(pending) draw(); }, 30));
function draw(){
  // nicht neu zeichnen, während in einem Formular getippt wird
  const a = document.activeElement;
  if(a && a.closest && a.closest("form") && a.closest("#content") && a.type !== "checkbox"){ pending = true; return; }
  pending = false;
  const app = document.getElementById("app");
  const tabs = [["teilnehmende", "Teilnehmende"], ["personen", "Personen & Mitglieder"], ["material", "Material & Helfer"], ["geruest", "Grundgerüst"], ["spieltage", "Spieltage"], ["aenderungen", "Änderungen"]];
  app.innerHTML = `
    <div class="topbar">
      <span class="crumbs"><a href="../../">MST Ermatingen</a> / <a href="../${D.test ? "?test" : ""}">Spieltag</a> / Organisation</span>
      <div id="userbar"></div>
    </div>
    ${D.test ? '<div class="test-banner"><span>🧪 Testmodus – nichts wird gespeichert.</span><a href="./">Testmodus beenden</a></div>' : ""}
    <div class="hero">
      <div class="hero-left">
        <img class="hero-logo" src="../../assets/logo.png" alt="">
        <div class="hero-titles">
          <span class="eyebrow">Spieltag · Organisation</span>
          <h1 class="hero-title">${YEAR ? `${ST.edition(YEAR)}. Minispieltag ${esc(YEAR)}` : "Spieltag"}</h1>
          <p class="hero-sub">${yearDoc ? esc([ST.fmtDate(yearDoc.date), yearDoc.place].filter(Boolean).join(" · ") || "Datum noch offen") : "noch kein Spieltag angelegt"}</p>
        </div>
      </div>
      <div class="hero-stats">
        <div class="stat-chip"><span class="num">${participants().length}</span><span class="lbl">angemeldet</span></div>
        <div class="stat-chip"><span class="num">${Object.keys(ST.persons).length}</span><span class="lbl">Personen</span></div>
      </div>
    </div>
    <div class="court-line"></div>
    <nav class="tabbar">${tabs.map(([k, l]) => `<button class="tabbtn ${tab === k ? "active" : ""}" data-tab="${k}">${l}</button>`).join("")}</nav>
    <section class="panel" id="content"></section>`;
  if(!D.test) MST.renderUserBar();
  else document.getElementById("userbar").innerHTML = '<span class="user-chip"><span class="admin-tag">Admin</span>Test</span>';
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; Object.keys(notes).forEach(k => delete notes[k]); draw(); });
  const c = document.getElementById("content");
  if(tab === "teilnehmende") viewParticipants(c);
  else if(tab === "personen") viewPersons(c);
  else if(tab === "geruest") viewCatalog(c);
  else if(tab === "material") viewMaterial(c);
  else if(tab === "aenderungen") viewChanges(c);
  else viewYears(c);
  Object.entries(notes).forEach(([id, t]) => { const el = document.getElementById(id); if(el) el.textContent = t; });
}

/* ---------- Teilnehmende ---------- */
function viewParticipants(c){
  if(!yearDoc){ c.innerHTML = `<div class="card"><p class="muted">Noch kein Spieltag angelegt – unter «Spieltage» anlegen.</p></div>`; return; }
  const parts = new Set(participants());
  const st = personStats();
  const ids = ST.sortByName(Object.keys(ST.persons)).filter(id => !filter || ST.nameOf(id).toLowerCase().includes(filter.toLowerCase()));
  const members = ids.filter(id => ST.persons[id].memberId);
  const guests = ids.filter(id => !ST.persons[id].memberId);
  const item = id => { const su = signupOf(id);
    return `<label class="pitem ${parts.has(id) ? "on" : ""}" title="${su ? (su[1].by ? "von dir eingetragen" : su[1].status === "ja" ? "hat sich selbst angemeldet" : "hat selbst abgesagt") : ""}"><input type="checkbox" data-p="${esc(id)}" ${parts.has(id) ? "checked" : ""}>${esc(ST.nameOf(id))}${su && !su[1].by ? (su[1].status === "ja" ? " ✋" : " ✗") : ""}
    <span class="meta">${esc(ST.startNr(id, []))}</span></label>`; };
  const n = parts.size;
  c.innerHTML = `<div class="two-col">
    <div class="card">
      <div class="count-row"><span class="count-big">${n}</span><span class="muted">angemeldet für ${esc(YEAR)}${n % 2 ? " · ungerade Zahl – geht trotzdem auf (siehe rechts)" : ""}</span></div>
      <div class="inline-form" style="margin-bottom:6px">
        <label>Gast dazunehmen<input id="guestName" autocomplete="off" placeholder="Spielname, z. B. Vando"></label>
        <label>Handy (nur Vorstand)<input id="guestPhone" autocomplete="off" inputmode="tel" placeholder="079 …"></label>
        <button class="btn-primary" id="guestAdd">+ Gast</button>
        <input class="search" id="search" placeholder="suchen …" value="${esc(filter)}" style="margin-left:auto">
      </div>
      <p class="form-msg" id="pMsg"></p>
      <div class="group-title"><span>Vereinsmitglieder (${members.filter(id => parts.has(id)).length}/${members.length})</span>
        <span><button class="btn-small" data-all="m">alle</button> <button class="btn-small" data-none="m">keine</button></span></div>
      <div class="plist">${members.map(item).join("")}</div>
      <div class="group-title"><span>Gäste dieses Jahr (${guests.filter(id => parts.has(id)).length})</span></div>
      <div class="plist">${guests.filter(id => parts.has(id)).map(item).join("") || '<span class="small muted">noch keine</span>'}</div>
      <details style="margin-top:10px" ${filter ? "open" : ""}><summary class="group-title" style="cursor:pointer; display:list-item">Alte Gäste & Ehemalige (${guests.filter(id => !parts.has(id)).length})</summary>
        <div class="plist" style="margin-top:8px">${guests.filter(id => !parts.has(id)).map(item).join("")}</div></details>
      ${MST.signupFlag(yearDoc) ? `<p class="small muted" style="margin:12px 0 0">Anmeldung läuft${MST.signupUntil(yearDoc) ? " bis " + esc(MST.fmtDay(MST.signupUntil(yearDoc))) : ""}: Mitglieder zählen erst, wenn sie selbst bestätigt haben (✋) oder du sie hier anhakst. ✗ = hat selbst abgesagt.</p>` : ""}
      ${Object.keys(signups).length ? `<p class="small muted" style="margin:6px 0 0">✋ ${Object.values(signups).filter(x => x.status === "ja" && !x.by).length} selbst angemeldet · ✗ ${Object.values(signups).filter(x => x.status === "nein").length} abgesagt. Anhaken/Abhaken hier geht vor.</p>` : ""}
      <p class="rule-note" style="margin:12px 0 0">Kleine Zahl rechts = Startnummer. Neue Vereinsmitglieder unter «Personen & Mitglieder» erfassen. Am Spieltag selbst: hier anhaken – im Spiel erscheint dann «neu dabei → einteilen».</p>
    </div>
    <div class="card"><h3>Geht es auf? (${n} Personen)</h3>${fitList(n)}</div>
  </div>`;
  c.querySelectorAll("[data-p]").forEach(cb => cb.onchange = () => toggle([cb.dataset.p], cb.checked));
  c.querySelector("[data-all]").onclick = () => toggle(members, true);
  c.querySelector("[data-none]").onclick = () => { if(confirm("Alle Mitglieder abmelden?")) toggle(members, false); };
  const s = document.getElementById("search");
  s.oninput = () => { filter = s.value; const pos = s.selectionStart; draw(); const s2 = document.getElementById("search"); s2.focus(); s2.setSelectionRange(pos, pos); };
  document.getElementById("guestAdd").onclick = addGuest;
  document.getElementById("guestName").onkeydown = e => { if(e.key === "Enter") addGuest(); };
  document.getElementById("guestPhone").onkeydown = e => { if(e.key === "Enter") addGuest(); };
}
function fitList(n){
  const gs = ((yearDoc && yearDoc.games) || []).map(E.normalizeGame);
  if(!gs.length) return '<p class="muted">Noch keine Spiele – auf der Spieltag-Seite hinzufügen.</p>';
  const parts = participants();
  return gs.map(g => {
    const units = E.unitCountFor(n, g);
    const d = gameData[g.id];
    let warn = "";
    if(d && d.units && d.units.length && !(E.isSolo(g) && g.mode === "rangliste")){
      const inUnits = new Set(d.units.flatMap(u => u.members));
      const fresh = parts.filter(p => !inUnits.has(p)).length;
      const gone = [...inUnits].filter(p => !parts.includes(p)).length;
      if(fresh || gone) warn = `Schon ausgelost: ${fresh ? fresh + " neu" : ""}${fresh && gone ? ", " : ""}${gone ? gone + " abgemeldet" : ""} → im Spiel anpassen`;
    }
    const too = !E.isSolo(g) ? units < 2 : n < 2;
    return `<div class="fit-row"><span class="ic">${esc(g.icon || "🎲")}</span><div><div class="nm">${esc(g.name)}</div>
      <div class="d">${too ? '<span class="w">zu wenige Personen</span>' : esc(E.describeUnits(n, g)) + (E.describeFormat(units, g) ? " · " + esc(E.describeFormat(units, g)) : "")}</div>
      ${warn ? `<div class="w">${esc(warn)}</div>` : ""}</div></div>`;
  }).join("");
}
async function toggle(ids, on){
  // Läuft die Anmeldung, gehen Mitglieder über signups/<memberId> (by:"admin") – die Liste enthält dann nur Gäste
  const viaSignup = id => MST.signupFlag(yearDoc) && ST.persons[id] && ST.persons[id].memberId;
  const set = new Set(participants());
  ids.forEach(id => on ? set.add(id) : set.delete(id));
  const ops = [{ op:"merge", path:`spieltag/${YEAR}`, data:{ participants:[...set].filter(id => !viaSignup(id)) } }];
  ids.forEach(id => {
    const mid = viaSignup(id), su = signupOf(id);
    if(mid && on) ops.push({ op:"set", path:`spieltag/${YEAR}/signups/${mid}`, data:{ pid:id, status:"ja", at:Date.now(), by:"admin" } });
    else if(su) ops.push({ op:"delete", path:`spieltag/${YEAR}/signups/${su[0]}` });
  });
  await D.batch(ops);
  log(`Spieltag ${YEAR}: ${ids.map(i => ST.nameOf(i)).join(", ")} ${on ? "angemeldet" : "abgemeldet"}`);
}
async function addGuest(){
  const inp = document.getElementById("guestName"), ph = document.getElementById("guestPhone");
  const name = inp.value.trim(), phone = ph.value.trim();
  if(!name) return;
  inp.value = ""; ph.value = "";
  const existing = Object.keys(ST.persons).find(id => ST.nameOf(id).toLowerCase() === name.toLowerCase());
  if(existing){
    if(phone) await savePhone(existing, phone);
    await toggle([existing], true);
    note("pMsg", `${name} gibt es schon – angemeldet.`);
    return;
  }
  const id = "g_" + ST.slug(name) + "_" + Math.random().toString(36).slice(2, 6);
  await D.set(`spieltagPersons/${id}`, { name, memberId:null, nr:ST.nextGuestNr() });
  if(phone) await savePhone(id, phone);
  await toggle([id], true);
  note("pMsg", `Gast ${name} angelegt und angemeldet.`);
  const again = document.getElementById("guestName"); if(again) again.focus();
}

/* Handynummern liegen in contacts/<id> (nur Vorstand lesbar), wie bei den Jahresbeiträgen */
async function savePhone(id, phone){
  if(D.test) return;
  try{ await db.collection("contacts").doc(id).set({ phone }, { merge:true }); }
  catch(e){ console.warn("Handynummer", e); }
}
async function loadPhone(id){
  if(D.test) return "";
  try{ const d = await db.collection("contacts").doc(id).get(); return d.exists ? d.data().phone || "" : ""; }
  catch(e){ return ""; }
}

/* ---------- Personen & Mitglieder ---------- */
function viewPersons(c){
  const st = personStats();
  const ids = ST.sortByName(Object.keys(ST.persons));
  const linked = new Set(Object.values(ST.persons).map(p => p.memberId).filter(Boolean));
  const missing = Object.entries(directory).filter(([id]) => !linked.has(id) && /^m\d+$/.test(id) && id !== "m999")
    .sort((a, b) => parseInt(a[0].slice(1)) - parseInt(b[0].slice(1)));
  c.innerHTML = `<div class="two-col">
    <div class="card"><h3>Alle Personen</h3>
      <p class="rule-note">Spielname = Name auf Spielplan und Rangliste. Nr. = Startnummer (Mitglieder: Vereinsnummer; der Titelverteidiger bekommt am Spieltag automatisch die 1). Antippen zum Ändern.</p>
      <div class="tbl-scroll"><table class="rank"><thead><tr><th class="num">Nr.</th><th>Spielname</th><th>Typ</th><th class="num">Spieltage</th><th class="num">zuletzt</th></tr></thead><tbody>
      ${ids.map(id => { const p = ST.persons[id], s = st[id];
        return `<tr class="click" data-edit="${esc(id)}"><td class="num">${esc(ST.startNr(id, []))}</td><td class="who">${esc(p.name)}${participants().includes(id) ? '<span class="tag y">' + esc(YEAR) + "</span>" : ""}</td>
          <td class="small muted">${p.memberId ? "Mitglied Nr. " + esc(p.memberId.slice(1)) + (directory[p.memberId] ? " · " + esc(directory[p.memberId].name) : "") : "Gast"}</td>
          <td class="num">${s ? s.n : 0}</td><td class="num">${s ? s.last : "–"}</td></tr>`; }).join("")}
      </tbody></table></div>
    </div>
    <div>
      <div class="card"><h3>Neues Vereinsmitglied</h3>
        <p class="rule-note">Legt gleichzeitig das Login für die Vereinsseite an (Nummer + Vorname) und die Person für den Spieltag.</p>
        <form class="grid-form" id="memberForm">
          <label>Nr.<input name="nr" inputmode="numeric" required></label>
          <label>Vorname<input name="vorname" required></label>
          <label>Nachname<input name="nachname"></label>
          <label>Kurzname<input name="short" placeholder="für die Vereinsseite"></label>
          <label>Spielname<input name="spielname" placeholder="für den Spieltag"></label>
          <label class="check-label"><input type="checkbox" name="dabei" ${yearDoc ? "checked" : "disabled"}> am Spieltag ${esc(YEAR || "")} dabei</label>
          <button class="btn-primary" type="submit">Speichern</button>
        </form>
        <p class="form-msg" id="mMsg"></p>
      </div>
      ${missing.length ? `<div class="card"><h3>Mitglieder ohne Spielname</h3>
        <p class="rule-note">Diese Vereinsmitglieder haben noch nie am Spieltag mitgemacht.</p>
        ${missing.map(([id, m]) => `<div class="fit-row"><div style="flex:1"><div class="nm">${esc(m.name)}</div><div class="d">Nr. ${esc(id.slice(1))}</div></div>
          <button class="btn-small" data-adopt="${esc(id)}">als Spieler übernehmen</button></div>`).join("")}</div>` : ""}
    </div>
  </div>`;
  c.querySelectorAll("[data-edit]").forEach(tr => tr.onclick = () => editPerson(tr.dataset.edit));
  c.querySelectorAll("[data-adopt]").forEach(b => b.onclick = async () => {
    const id = b.dataset.adopt, m = directory[id];
    const name = prompt(`Spielname für ${m.name}:`, m.short || m.name.split(" ")[0]);
    if(!name) return;
    await D.set(`spieltagPersons/${id}`, { name:name.trim(), memberId:id, nr:id.slice(1) });
    log(`Spieltag: ${m.name} als «${name.trim()}» übernommen`);
  });
  document.getElementById("memberForm").onsubmit = saveMember;
}
async function saveMember(e){
  e.preventDefault();
  const f = e.target, msg = document.getElementById("mMsg");
  const nr = parseInt(f.nr.value, 10);
  const vorname = f.vorname.value.trim(), nachname = f.nachname.value.trim();
  if(!nr || !MST.normalizeVorname(vorname)){ msg.textContent = "Nummer und Vorname braucht es."; return; }
  const id = "m" + nr;
  if(directory[id] && !confirm(`Nr. ${nr} gehört schon ${directory[id].name}. Überschreiben?`)) return;
  const spielname = f.spielname.value.trim() || f.short.value.trim() || vorname;
  const key = await MST.loginKey(nr, vorname);
  // bestehende Spieltag-Person mit diesem Namen (z. B. bisher Gast) übernehmen statt doppelt anlegen
  const existing = Object.keys(ST.persons).find(pid => !ST.persons[pid].memberId && ST.nameOf(pid).toLowerCase() === spielname.toLowerCase());
  const pid = ST.persons[id] ? id : existing || id;
  const ops = [
    { op:"set", path:`members/${key}`, data:{ id } },
    { op:"set", path:`memberDirectory/${id}`, data:{ name:(vorname + " " + nachname).trim(), short:f.short.value.trim() || vorname } },
    { op:"set", path:`spieltagPersons/${pid}`, data:{ name:spielname, memberId:id, nr:String(nr) } }
  ];
  if(f.dabei.checked && yearDoc && !participants().includes(pid)) ops.push(MST.signupFlag(yearDoc)
    ? { op:"set", path:`spieltag/${YEAR}/signups/${id}`, data:{ pid, status:"ja", at:Date.now(), by:"admin" } }
    : { op:"merge", path:`spieltag/${YEAR}`, data:{ participants:participants().concat([pid]) } });
  try{
    await D.batch(ops);
    log(`Neues Mitglied ${nr} ${(vorname + " " + nachname).trim()} (Spielname ${spielname})`);
    directory[id] = { name:(vorname + " " + nachname).trim(), short:f.short.value.trim() || vorname };
    f.reset();
    document.activeElement && document.activeElement.blur();
    note("mMsg", `Gespeichert: Login = Nummer ${nr} + Vorname «${vorname.split(/\s+/)[0]}».${existing ? ` Bisheriger Gast «${spielname}» ist jetzt Mitglied (Historie bleibt).` : ""}`);
    draw();
  }catch(err){ console.error(err); note("mMsg", "Speichern fehlgeschlagen."); }
}
async function editPerson(id){
  const p = ST.persons[id];

  dlg.innerHTML = `<form method="dialog">
    <h3>${esc(p.name)}</h3><p class="dlg-sub">${p.memberId ? "Vereinsmitglied Nr. " + esc(p.memberId.slice(1)) : "Gast"}</p>

    ${p.memberId ? "" : `<label>Ist jetzt Vereinsmitglied mit Nr.<input name="mnr" inputmode="numeric" placeholder="leer lassen = bleibt Gast"></label>
      <p class="rule-note" style="margin:0">Fürs Login dann «Neues Vereinsmitglied» mit derselben Nummer und demselben Spielnamen ausfüllen – die Historie bleibt erhalten.</p>`}
    <div class="dlg-actions">
      ${used ? "<span></span>" : '<button type="button" class="btn-danger" id="pDel">Löschen</button>'}
      <div class="right"><button type="button" class="btn-ghost" id="pCancel">Abbrechen</button><button class="btn-primary" type="submit">Speichern</button></div>
    </div></form>`;
  dlg.querySelector("#pCancel").onclick = () => dlg.close();
  if(!used) dlg.querySelector("#pDel").onclick = async () => { if(confirm(`${p.name} löschen?`)){ await D.remove(`spieltagPersons/${id}`); dlg.close(); } };
  dlg.querySelector("form").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const upd = { name:f.name.value.trim() || p.name, memberId:p.memberId || null, nr:f.nr.value.trim() || p.nr || "" };
    if(f.mnr && f.mnr.value.trim()){ upd.memberId = "m" + parseInt(f.mnr.value, 10); upd.nr = String(parseInt(f.mnr.value, 10)); }
    await D.set(`spieltagPersons/${id}`, upd);

    log(`Spieltag-Person ${p.name} → ${upd.name}${upd.memberId !== p.memberId ? " (Mitglied " + upd.memberId + ")" : ""}`);
    dlg.close();
  };
  dlg.showModal();
}

function viewCatalog(c){
  const played = {};
  history.forEach(y => (y.disciplines || []).forEach(d => { if(d.catId){ const p = played[d.catId] = played[d.catId] || { n:0, last:0 }; p.n++; p.last = Math.max(p.last, y.year); } }));
  const inYear = new Set(((yearDoc && yearDoc.games) || []).map(g => g.catId || g.id));
  const cats = { Einzel:[], Partner:[], Gruppe:[] };
  catalog.forEach((g, i) => cats[E.category(E.normalizeGame(g))].push({ g, i }));
  const n = participants().length;
  c.innerHTML = `<div class="card catlist"><h3>Grundgerüst der Disziplinen</h3>
    <p class="rule-note">Vorlage für jedes Jahr: Spielform, Modus und Punkte. Auf der Spieltag-Seite kann jedes Spiel fürs Jahr noch angepasst oder gewechselt werden. Antippen zum Bearbeiten.</p>
    ${Object.entries(cats).map(([k, list]) => list.length ? `<div class="group-title"><span>${k}</span></div>` + list.map(({ g, i }) => {
      const p = played[g.id];
      return `<div class="fit-row" data-cat="${i}"><span class="ic">${esc(g.icon || "🎲")}</span><div style="flex:1"><div class="nm">${esc(g.name)}${inYear.has(g.id) ? `<span class="tag y">${esc(YEAR)}</span>` : ""}</div>
        <div class="d">${esc(E.summary(g))} · max. ${E.normalizeGame(g).maxPoints}</div>
        <div class="d small">${p ? `${p.n}× gespielt, zuletzt ${p.last}` : "noch nie gespielt"}</div></div>
        ${yearDoc && !inYear.has(g.id) ? `<button class="btn-small" data-addyear="${i}">+ ${esc(YEAR)}</button>` : ""}</div>`;
    }).join("") : "").join("")}
    <div style="margin-top:12px"><button class="btn-ghost" id="newCat">+ Neue Disziplin</button></div>
  </div>`;
  c.querySelectorAll("[data-cat]").forEach(row => row.onclick = (e) => {
    if(e.target.closest("button")) return;
    const i = +row.dataset.cat;
    GameDialog.open(catalog[i], { title:`Grundgerüst: ${catalog[i].name}`, participants:n,
      onSave: async g => { const list = catalog.slice(); list[i] = Object.assign({}, g, { id:catalog[i].id }); delete list[i].catId; await saveCatalog(list); },
      onDelete: async () => { const list = catalog.slice(); list.splice(i, 1); await saveCatalog(list); } });
  });
  c.querySelectorAll("[data-addyear]").forEach(b => b.onclick = async () => {
    const g = JSON.parse(JSON.stringify(catalog[+b.dataset.addyear]));
    const list = (yearDoc.games || []).slice();
    let id = g.id, k = 2; while(list.some(x => x.id === id)) id = g.id + "_" + k++;
    list.push(Object.assign(g, { id, catId:catalog[+b.dataset.addyear].id }));
    await D.merge(`spieltag/${YEAR}`, { games:list });
  });
  document.getElementById("newCat").onclick = () => GameDialog.open({ name:"", icon:"🎲" }, { title:"Neue Disziplin", participants:n,
    onSave: async g => {
      let id = ST.slug(g.name), k = 2; while(catalog.some(x => x.id === id)) id = ST.slug(g.name) + "_" + k++;
      await saveCatalog(catalog.concat([Object.assign({}, g, { id })]));
    } });
}

/* ---------- Material & Helfer pro Station ---------- */
function viewMaterial(c){
  const gs = ((yearDoc && yearDoc.games) || []).map(E.normalizeGame)
    .sort((a, b) => (E.parseTime(a.start) ?? 9999) - (E.parseTime(b.start) ?? 9999));
  const nameOfMember = mid => { const p = ST.pidOfMember(mid); return p ? ST.nameOf(p) : mid; };
  let open = 0, total = 0;
  const rows = gs.map(g => {
    const items = String(g.material || "").split("\n").map(x => x.trim()).filter(Boolean);
    const d = gameData[g.id] || {}, done = d.materialDone || {}, lead = (d.leaders || []).map(nameOfMember);
    total += items.length; open += items.filter((_, i) => !done[i]).length;
    return `<div class="fit-row"><span class="ic">${esc(g.icon || "🎲")}</span><div style="flex:1"><div class="nm">${esc(g.start || "–")} · ${esc(g.name)}${g.place ? ` <span class="small muted">${esc(g.place)}</span>` : ""}</div>
      <div class="d">${lead.length ? "Leitung: " + esc(lead.join(", ")) : '<span class="w">keine Stationsleitung</span>'}</div>
      <div style="margin-top:4px">${items.map((it, i) => `<label class="pitem ${done[i] ? "on" : ""}" style="display:inline-flex; margin:0 6px 6px 0"><input type="checkbox" data-g="${esc(g.id)}" data-i="${i}" ${done[i] ? "checked" : ""}>${esc(it)}${done[i] ? ` <span class="meta">${esc(done[i])}</span>` : ""}</label>`).join("") || '<span class="small muted">kein Material erfasst – im Spieltag unter ✎ Einstellen</span>'}</div></div></div>`;
  }).join("");
  c.innerHTML = `<div class="card"><h3>Material & Helfer ${esc(YEAR)} <span class="tag ${open ? "" : "y"}">${total - open}/${total} bereit</span></h3>
    <p class="rule-note">Material pro Spiel unter «✎ Einstellen», Stationsleitung im Spiel unter «👤 Stationsleitung». Abhaken können Admin und die Stationsleitung.</p>${rows}</div>`;
  c.querySelectorAll("[data-g]").forEach(cb => cb.onchange = () => D.merge(`spieltag/${YEAR}/games/${cb.dataset.g}`, { materialDone:{ [cb.dataset.i]:cb.checked ? (me.short || me.name || "Admin") : null } }));
}

async function closeYear(){
  const gs = (yearDoc.games || []).map(E.normalizeGame);
  const ov = E.overall(gs, gameData, { participants:participants() });
  const open = gs.filter(g => !ov.evals[g.id].final);
  if(open.length && !confirm(`Noch nicht fertig: ${open.map(g => g.name).join(", ")}. Trotzdem mit dem aktuellen Stand übernehmen?`)) return;
  // Rangliste + Teams, Duelle und Rohresultate (für bester Partner, Angstgegner, Rekorde)
  const doc = SpieltagStats.archiveYear(E, YEAR, gs, gameData, participants(), pid => ST.nameOf(pid));
  await D.set(`spieltagHistory/${YEAR}`, doc);
  await D.merge(`spieltag/${YEAR}`, { closed:true });
  log(`Spieltag ${YEAR} in die Historie übernommen`);
  note("cMsg", `Übernommen: ${doc.rows.length} Personen, Sieger ${doc.rows.filter(r => r.rank === 1).map(r => r.name).join(" & ")}, ${doc.duels.length} Duelle.`);
}
